plugins {
    id 'com.android.application'
}

def propiedadesLocales = new Properties()
def archivoLocal = rootProject.file('local.properties')
if (archivoLocal.exists()) {
    archivoLocal.withInputStream { propiedadesLocales.load(it) }
}

android {
    namespace = 'com.sralberto.petagram'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.sralberto.petagram'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'

        buildConfigField 'String', 'CORREO_USUARIO', "\"${propiedadesLocales.getProperty('correo.usuario', '')}\""
        buildConfigField 'String', 'CORREO_CLAVE', "\"${propiedadesLocales.getProperty('correo.clave', '')}\""
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['/META-INF/LICENSE.md', '/META-INF/NOTICE.md']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.mikhaellopez:circularimageview:4.3.1'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // Consumo del API de Instagram: Retrofit hace las peticiones y Gson convierte el JSON
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    // Descarga y muestra las fotos a partir de su URL
    implementation 'com.github.bumptech.glide:glide:5.0.5'
}
